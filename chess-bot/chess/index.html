<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chess</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <header class="app-header">
    <h1>Chess</h1>
    <div class="header-controls">
      <label class="field">
        <span class="field-label">Opponent</span>
        <select id="opponent">
          <option value="ai">Computer</option>
          <option value="human">Two players</option>
        </select>
      </label>
      <label class="field" id="level-field">
        <span class="field-label">Engine</span>
        <select id="level">
          <optgroup label="Search (no LLM)">
            <option value="beginner">Beginner</option>
            <option value="casual">Casual</option>
            <option value="intermediate">Intermediate</option>
            <option value="strong">Strong</option>
            <option value="expert">Expert</option>
          </optgroup>
          <optgroup label="Neural nets (trained)">
            <option value="neural" selected>Neural net · 5.6M, top-1 43%</option>
            <option value="neural2">Neural net XL · 9.9M, top-1 51%</option>
          </optgroup>
        </select>
      </label>
      <label class="field" id="side-field">
        <span class="field-label">Play as</span>
        <select id="side">
          <option value="white" selected>White</option>
          <option value="black">Black</option>
        </select>
      </label>

      <button class="info-btn" id="btn-model-info" type="button" aria-haspopup="dialog">
        <span class="info-btn-mark" aria-hidden="true">i</span>
        <span class="info-btn-text">About this opponent</span>
      </button>
    </div>
  </header>

  <main class="layout">
    <section class="board-area">
      <!-- `board-frame` is the size container. The board and both player strips
           are sized from the same value, so their edges line up exactly. -->
      <div class="board-frame">
        <div class="player-strip" id="strip-top">
          <span class="player-name"></span>
          <span class="material"></span>
          <span class="captured" aria-label="Captured pieces"></span>
        </div>

        <div class="board-wrap">
          <!-- The board is a grid of buttons so it is keyboard and screen-reader usable. -->
          <div class="board" id="board" role="grid" aria-label="Chess board"></div>
          <div class="promotion-overlay" id="promotion" hidden>
            <div class="promotion-dialog" role="dialog" aria-modal="true" aria-labelledby="promo-title">
              <h2 id="promo-title">Promote to</h2>
              <div class="promotion-choices" id="promotion-choices"></div>
            </div>
          </div>
        </div>

        <div class="player-strip" id="strip-bottom">
          <span class="player-name"></span>
          <span class="material"></span>
          <span class="captured" aria-label="Captured pieces"></span>
        </div>
      </div>
    </section>

    <aside class="panel">
      <div class="outcome" id="outcome" hidden role="status" aria-live="polite">
        <div class="outcome-text">
          <strong id="outcome-title"></strong>
          <span id="outcome-detail"></span>
        </div>
      </div>

      <div class="status" id="status" role="status" aria-live="polite">
        <span class="status-turn" id="status-turn">White to move</span>
        <span class="status-detail" id="status-detail"></span>
      </div>

      <div class="eval" id="eval-row">
        <div class="eval-bar" aria-hidden="true"><div class="eval-fill" id="eval-fill"></div></div>
        <span class="eval-text" id="eval-text">—</span>
      </div>

      <div class="moves-header">
        <span>Moves</span>
        <span class="thinking" id="thinking" hidden><span class="thinking-dot"></span>thinking…</span>
      </div>
      <ol class="moves" id="moves" tabindex="0" aria-label="Move list"></ol>

      <div class="controls">
        <button class="btn" id="btn-new">New game</button>
        <button class="btn" id="btn-undo">Undo</button>
        <button class="btn" id="btn-flip">Flip board</button>
        <button class="btn" id="btn-hint">Hint</button>
      </div>

      <label class="field-check" id="animate-field">
        <input type="checkbox" id="animate" checked>
        <span class="field-label">Animate computer moves</span>
      </label>

      <details class="fen-box">
        <summary>Position (FEN)</summary>
        <textarea id="fen" spellcheck="false" rows="3" aria-label="FEN"></textarea>
        <div class="fen-actions">
          <button class="btn btn-small" id="btn-load">Load</button>
          <button class="btn btn-small" id="btn-copy">Copy</button>
          <span class="fen-msg" id="fen-msg" role="status" aria-live="polite"></span>
        </div>
      </details>
    </aside>
  </main>
</div>

<!-- Full-screen loading card while the neural net's weights are downloading. -->
<div class="loading-overlay" id="loading" hidden role="status" aria-live="polite">
  <div class="loading-card">
    <div class="loading-spinner" aria-hidden="true"></div>
    <h2 id="loading-title">Loading chess engine</h2>
    <p id="loading-detail">Downloading neural network weights…</p>
    <div class="loading-bar" id="loading-bar" aria-hidden="true">
      <div class="loading-fill" id="loading-fill"></div>
    </div>
    <button class="btn btn-primary" id="loading-retry" hidden>Try again</button>
  </div>
</div>

<!-- Win and loss effects. Above everything, never in the way of pointer input:
     the finished position is the thing worth looking at. -->
<canvas class="fx-canvas" id="fx" aria-hidden="true"></canvas>

<!-- What the computer is, and what it is actually doing. A native dialog gets
     focus trapping, Escape, and the top layer for free. -->
<dialog class="model-dialog" id="model-dialog" aria-labelledby="model-dialog-title">
  <header class="model-dialog-head">
    <div class="model-dialog-heading">
      <span class="model-kind" id="model-kind"></span>
      <h2 id="model-dialog-title"></h2>
    </div>
    <button class="icon-btn" id="model-close" type="button" aria-label="Close">
      <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
        <path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
    </button>
  </header>
  <p class="model-tagline" id="model-tagline"></p>
  <dl class="model-stats" id="model-stats"></dl>
  <div class="model-body" id="model-body"></div>
</dialog>

<script type="module" src="src/app.js"></script>
</body>
</html>
